name: Release

# Fires when a tag like v0.1.0 is pushed.  Builds the iris-web binary
# for four targets (Mac arm64/x64, Linux arm64/x64), packages each one
# alongside the built client assets + README/LICENSE into a tarball,
# and publishes them on a GitHub Release that the README's curl-install
# command can hit.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build the client
        run: bun run --cwd client build

      - name: Compile binaries + package archives
        run: |
          set -euo pipefail
          mkdir -p dist
          # Server-only targets.  Mac users who want a chat app should
          # download Iris.app from its own distribution channel; the
          # darwin builds below would confuse those users into thinking
          # this is the desktop app.  Self-hosting iris-web ON a Mac
          # is rare; those folks can build from source if they want to.
          #
          # Archive names are version-FREE on purpose — the version
          # lives in the URL path (.../releases/v0.1.0/iris-web-linux-x64.tar.gz
          # vs .../releases/latest/download/iris-web-linux-x64.tar.gz).
          # A stable filename means the README's curl-install one-liner
          # works against `/latest/` forever without a rewrite per bump.
          #
          # Windows ships as .zip (the OS-native archive format) and the
          # binary is irisweb.exe.  iris-windows's Tauri build pipeline
          # pulls this zip during CI to bundle the sidecar.
          for target in linux-arm64 linux-x64 windows-x64; do
            echo "::group::Building $target"
            outdir="dist/iris-web-$target"
            mkdir -p "$outdir"

            if [[ "$target" == windows-* ]]; then
              binary="irisweb.exe"
            else
              binary="irisweb"
            fi

            # Cross-compile the server to a single static binary.
            bun build --compile \
              --target="bun-$target" \
              --outfile "$outdir/$binary" \
              ./server/src/index.ts

            # Bundle the static client + license + readme alongside the
            # binary so end users can `./irisweb` straight from the dir.
            cp -R client/dist "$outdir/iris-web-client"
            cp README.md LICENSE "$outdir/"

            if [[ "$target" == windows-* ]]; then
              (cd dist && zip -qr "iris-web-${target}.zip" "iris-web-$target")
            else
              tar -C dist -czf "dist/iris-web-${target}.tar.gz" "iris-web-$target"
            fi
            echo "::endgroup::"
          done
          ls -lh dist/iris-web-*.tar.gz dist/iris-web-*.zip

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum iris-web-*.tar.gz iris-web-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/iris-web-*.tar.gz
            dist/iris-web-*.zip
            dist/SHA256SUMS.txt
