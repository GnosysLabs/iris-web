name: Release

# Fires when a tag like v0.1.0 is pushed.  Builds the iris-web binary
# for four targets (Mac arm64/x64, Linux arm64/x64), packages each one
# alongside the built client assets + README/LICENSE into a tarball,
# and publishes them on a GitHub Release that the README's curl-install
# command can hit.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build the client
        run: bun run --cwd client build

      - name: Compile binaries + package tarballs
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Server-only targets.  Mac users who want a chat app should
          # download Iris.app from its own distribution channel; the
          # darwin builds below would confuse those users into thinking
          # this is the desktop app.  Self-hosting iris-web ON a Mac
          # is rare; those folks can build from source if they want to.
          for target in linux-arm64 linux-x64; do
            echo "::group::Building $target"
            outdir="dist/iris-web-$target"
            mkdir -p "$outdir"

            # Cross-compile the server to a single static binary.
            bun build --compile \
              --target="bun-$target" \
              --outfile "$outdir/irisweb" \
              ./server/src/index.ts

            # Bundle the static client + license + readme alongside the
            # binary so end users can `./irisweb` straight from the dir.
            cp -R client/dist "$outdir/iris-web-client"
            cp README.md LICENSE "$outdir/"

            tar -C dist -czf "dist/iris-web-${VERSION}-${target}.tar.gz" "iris-web-$target"
            echo "::endgroup::"
          done
          ls -lh dist/*.tar.gz

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
